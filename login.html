<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCloud PS4 - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0B0B0B;
            color: #FFFFFF;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0B0B0B 100%);
        }
        .login-container {
            display: flex; flex-direction: row; align-items: center; gap: 60px;
            background: rgba(255, 255, 255, 0.03); padding: 50px 80px;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .qr-box {
            background: #FFFFFF; padding: 15px; border-radius: 10px;
            width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;
        }
        .qr-placeholder {
            width: 100%; height: 100%;
            background-image: repeating-linear-gradient(45deg, #000 0, #000 10px, transparent 10px, transparent 20px);
            background-color: #fff;
        }
        .info-box { display: flex; flex-direction: column; max-width: 350px; }
        .logo { font-size: 28px; font-weight: 800; color: #FFFFFF; margin-bottom: 10px; letter-spacing: -0.5px; }
        .logo span { color: #107C10; }
        .instructions { font-size: 15px; color: #b0b0b0; line-height: 1.5; margin-bottom: 25px; }
        .code-display {
            background: #1a1a1a; border: 2px dashed #333; padding: 15px 30px;
            border-radius: 12px; font-size: 32px; font-weight: bold;
            letter-spacing: 5px; text-align: center; color: #107C10; margin-bottom: 15px;
        }
        .status-text { font-size: 13px; color: #555; text-align: center; transition: color 0.3s; }
        
        /* Animación de éxito */
        .success { color: #107C10 !important; font-weight: bold; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .footer-note { font-size: 12px; color: #555; text-align: center; position: absolute; bottom: 20px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="qr-box">
            <div class="qr-placeholder"></div>
        </div>
        <div class="info-box">
            <div class="logo">XCLOUD <span>PS4</span></div>
            <p class="instructions">Abre el navegador en tu móvil o PC y entra a:<br><b style="color:#fff;">microsoft.com/link</b><br><br>O escanea el código QR e ingresa el siguiente código para vincular tu cuenta de Xbox:</p>
            
            <div class="code-display">K7M2-QP9X</div>
            
            <p class="status-text" id="status">Esperando a que inicies sesión...</p>
        </div>
    </div>

    <div class="footer-note">Hecho para He. Porque tu PS4 merece más.</div>

    <script>
        // Simulando que el usuario escaneó el QR y puso el código
        setTimeout(() => {
            const status = document.getElementById('status');
            status.innerText = "¡Cuenta vinculada con éxito! Entrando...";
            status.classList.add('success');
            
            // Después de 2 segundos más, entra al menú
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 2000);

        }, 5000); // 5 segundos de espera simulando el escaneo
    </script>
</body>
</html>
